<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      /* Secure Terminal Palette (Zinc based) */
      --bg-base: #F4F4F5;
      --bg-card: #FFFFFF;
      --bg-secondary: #FAFAFA;
      
      --ink-primary: #09090B;
      --ink-secondary: #52525B;
      --ink-muted: #A1A1AA;
      
      --hairline: #E4E4E7;
      --hairline-dark: #D4D4D8;
      
      --crimson: #E11D48;
      --success: #10B981;

      /* Typography */
      --font-sans: system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    
    body {
      width: 360px;
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--ink-primary);
      overflow-x: hidden;
      border: 1px solid var(--hairline-dark);
    }

    /* ── Header (Terminal Style) ── */
    .header {
      background-color: var(--ink-primary);
      color: var(--bg-card);
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 2px solid var(--crimson);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .header__meta {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .header__title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header__title img {
      width: 24px;
      height: 24px;
      border-radius: 2px;
      filter: grayscale(100%) contrast(1.2);
    }

    .header__subtitle {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--bg-base);
      opacity: 0.8;
      text-transform: uppercase;
    }

    /* ── Data Stream Status (Signature Element) ── */
    .stream-status {
      display: flex;
      align-items: center;
      padding: 1rem 1.25rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--hairline);
      gap: 1rem;
    }

    .stream-status__indicator {
      width: 12px;
      height: 12px;
      border-radius: 0; /* Square block */
      flex-shrink: 0;
    }

    .stream-status.ready .stream-status__indicator {
      background-color: var(--success);
      animation: blink 1.5s steps(2, start) infinite;
    }

    .stream-status.waiting .stream-status__indicator {
      background-color: var(--ink-muted);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .stream-status__text {
      display: flex;
      flex-direction: column;
    }

    .stream-status__title {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink-primary);
      text-transform: uppercase;
    }

    .stream-status__desc {
      font-size: 0.8rem;
      color: var(--ink-secondary);
      margin-top: 0.1rem;
    }

    /* ── Content Area ── */
    .content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ── Checkpoints ── */
    #savedDataContainer {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--hairline);
      border-radius: 2px;
    }

    #savedDataContainer h4 {
      margin: 0;
      padding: 0.75rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--ink-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--hairline);
      background: var(--bg-secondary);
    }

    #profilesList {
      display: flex;
      flex-direction: column;
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem;
      border: 1px solid transparent;
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--ink-primary);
      color: var(--bg-card);
    }

    .btn-primary:hover {
      background-color: var(--ink-secondary);
    }

    .btn-secondary {
      background-color: transparent;
      border-color: var(--hairline-dark);
      color: var(--ink-primary);
    }

    .btn-secondary:hover {
      background-color: var(--bg-secondary);
      border-color: var(--ink-primary);
    }

    .footer {
      text-align: center;
      padding: 0 1.25rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--ink-muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header__meta">[ SYS.CONNECTION ] SMART NID LINK</div>
    <h1 class="header__title">
      <img src="icons/icon.png" onerror="this.style.display='none'" alt="Logo">
      Smart NID
    </h1>
    <p class="header__subtitle">Secure Data Transfer Protocol</p>
  </div>

  <div id="statusContainer" class="stream-status waiting">
    <div class="stream-status__indicator"></div>
    <div class="stream-status__text">
      <div class="stream-status__title" id="statusTitle">Awaiting Data</div>
      <div class="stream-status__desc" id="statusDesc">Extract NID data first.</div>
    </div>
  </div>

  <div class="content">
    <!-- Saved Data Summary Box -->
    <div id="savedDataContainer">
      <h4>[ DIR_CHECKPOINTS ]</h4>
      <div id="profilesList">
        <!-- Populated dynamically via popup.js -->
      </div>
    </div>

    <div class="actions">
      <button id="btnOpenApp" class="btn btn-primary">
        OPEN WEB DASHBOARD &crarr;
      </button>
      
      <button id="btnOpenGov" class="btn btn-secondary">
        LAUNCH DONIDCR PORTAL &#8599;
      </button>
    </div>
  </div>

  <div class="footer">
    Smart NID Helper v1.1.0 • DEP-AUTO
  </div>

  <script src="popup.js"></script>
</body>
</html>
